[package]
name = "keyboard-matrix"
version = "0.1.0"
edition = "2021"

[profile.release]
debug = 2  # This ensures line numbers and logs work properly

[dependencies]
embassy-embedded-hal = "0.6.0"
embassy-time = "0.5.1"
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "0.3", features = ["print-defmt"] }
defmt = "0.3"
defmt-rtt = "0.4"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["time-driver", "rp2040", "critical-section-impl"] }
